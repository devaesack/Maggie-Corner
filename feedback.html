<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="assets/js/style1.css">
  <title>FeedBack</title>
</head>

    

<body class="bg-yellow-100">
  <header>

    <h1 class="text-center p-7  font-semibold text-3xl bg-gradient-to-r from-orange-500 to-yellow-500" id="mcorner" >
      MaGGiE CoRneR🍜 <span><a  class="fespan" href="index.html">Back</a></span> 
      </h1>
  </header>

  <main>
<h4 class="heading"> FeedBack Form </h4>

 <form name="feedback">
    <div>
        <input type="text" name="fullName" placeholder="Fullname" class="namecls" required>
    </div>
<div class="d-flex" >
    <div class="d-flex">
        <input  type="radio" name="radio" value="General Feedback " id="gen-feedback" required >
        <label for="gen-feedback">General Feedback </label>
    </div>

    <div class="d-flex">
        <input type="radio" name="radio" value="Technical Support" id="tech-supp" required >
        <label for="tech-supp">Technical Support </label>
    </div>

     <div class="d-flex">
        <input type="radio" name="radio" value="Contribution" id="contribution" required >
        <label for="contribution">Contribution </label>
    </div>
    </div>

    <div class="newDiv">
    <div>
        <input type="email" name="email" placeholder="example@gmail.com" required>
    </div>
    <div>
     <select name="country" id="country" >
        <option value="">--Select Country--</option>
        <option value="IND" >India</option>
        <option value="LK">SriLanka</option>
        <option value="MYS">Malaysia</option>
        <option value="SGP">Singapore</option>
        <option value="THA">Thailand</option>
     </select>
    </div>
    </div>
    <div>
        <textarea  rows="4 " placeholder="Enter Your FeedBack!" name="feedback" required >
        </textarea>
    </div>
<div>
    <label for="terms">
   <input type="checkbox" name="checkbox" id="terms" required>
   accept The terms And Conditions
   </label>
</div>

<div>
    <button type="submit" name="submit" >SUBMIT</button>
</div>
 </form>

</main>
    
<script src="assets/js/main.js"></script>
  <script src="assets/js/learning.js"></script>
</body>
</html>
